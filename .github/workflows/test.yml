name: Test and package skill
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15-intel]
        python: ['3.9', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/doctor.py
      - run: python tools/build_package.py
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.12'
        with:
          name: design-asset-organizer
          path: dist/*
